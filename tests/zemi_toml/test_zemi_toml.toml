# Пример конфигурации двух llama.cpp-серверов.
# Значение prefix каждой сессии хранится как проверяемая ссылка на Markdown-файл.

non_text_reference = "@comp/.zemicomp"
text_reference = "@comp/tests/zemi_toml/prefixes/plain-text.txt"

# ==============================================================================
# СЕРВЕР: primary
# ==============================================================================
[[arsenal.llamas]]
    name = "primary"
    llama_build = "llama:b9222"
    host = "127.0.0.1"
    port = 8080
    startup_timeout = 120.0

    # --------------------------------------------------------------------------
    # МОДЕЛЬ: qwen
    # --------------------------------------------------------------------------
    [[arsenal.llamas.models]]
        name = "qwen"
        source = "hf"
        owner = "bartowski"
        repository = "Qwen_Qwen3.5-4B-GGUF"
        filename = "Qwen_Qwen3.5-4B-Q4_K_M.gguf"
        alias = "qwen3.5-4b"
        ctx_size = 8192
        threads = 8
        threads_batch = 8
        reasoning = "off"

        # ......................................................................
        # АССИСТЕНТ: assistant
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "assistant"
            prefix = "@comp/tests/zemi_toml/prefixes/qwen-system.md"

        # ......................................................................
        # АССИСТЕНТ: json_converter
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "json_converter"
            prefix = "@comp/tests/zemi_toml/prefixes/qwen-json.md"

    # --------------------------------------------------------------------------
    # МОДЕЛЬ: smollm
    # --------------------------------------------------------------------------
    [[arsenal.llamas.models]]
        name = "smollm"
        source = "hf"
        owner = "bartowski"
        repository = "SmolLM2-1.7B-Instruct-GGUF"
        filename = "SmolLM2-1.7B-Instruct-Q4_K_M.gguf"
        alias = "smollm2-1.7b"
        ctx_size = 4096
        threads = 6
        threads_batch = 6
        reasoning = "off"

        # ......................................................................
        # АССИСТЕНТ: assistant
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "assistant"
            prefix = "@comp/tests/zemi_toml/prefixes/smollm-system.md"

        # ......................................................................
        # АССИСТЕНТ: document_classifier
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "document_classifier"
            prefix = "@comp/tests/zemi_toml/prefixes/smollm-classifier.md"

# ==============================================================================
# СЕРВЕР: secondary
# ==============================================================================
[[arsenal.llamas]]
    name = "secondary"
    llama_build = "llama:b9222"
    host = "127.0.0.1"
    port = 8081
    startup_timeout = 120.0

    # --------------------------------------------------------------------------
    # МОДЕЛЬ: phi
    # --------------------------------------------------------------------------
    [[arsenal.llamas.models]]
        name = "phi"
        source = "hf"
        owner = "bartowski"
        repository = "Phi-3.5-mini-instruct-GGUF"
        filename = "Phi-3.5-mini-instruct-Q4_K_M.gguf"
        alias = "phi-3.5-mini"
        ctx_size = 8192
        threads = 8
        threads_batch = 8
        reasoning = "off"

        # ......................................................................
        # АССИСТЕНТ: analyst
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "analyst"
            prefix = "@comp/tests/zemi_toml/prefixes/phi-system.md"

        # ......................................................................
        # АССИСТЕНТ: reporter
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "reporter"
            prefix = "@comp/tests/zemi_toml/prefixes/phi-report.md"

    # --------------------------------------------------------------------------
    # МОДЕЛЬ: llama
    # --------------------------------------------------------------------------
    [[arsenal.llamas.models]]
        name = "llama"
        source = "hf"
        owner = "bartowski"
        repository = "Llama-3.2-3B-Instruct-GGUF"
        filename = "Llama-3.2-3B-Instruct-Q4_K_M.gguf"
        alias = "llama-3.2-3b"
        ctx_size = 8192
        threads = 8
        threads_batch = 8
        reasoning = "off"

        # ......................................................................
        # АССИСТЕНТ: document_assistant
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "document_assistant"
            prefix = "@comp/tests/zemi_toml/prefixes/llama-system.md"

        # ......................................................................
        # АССИСТЕНТ: summarizer
        # ......................................................................
        [[arsenal.llamas.models.assistants]]
            name = "summarizer"
            prefix = "@comp/tests/zemi_toml/prefixes/llama-summary.md"
