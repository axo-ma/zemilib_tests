[system]
version = "0.3"

[system.params]

[component]
stop_on_error = true

[component.params]

[[arsenals]]
id = "local-models"
config_path = "@comp/zemi/llm_curated_set_model_mode.toml"
lifecycle = "job"

[arsenals.params]

[[playbooks]]
id = "default"
path = "playbook.ipynb"
arsenal = "local-models"
enabled = true

[playbooks.params]
model_name = "lfm2_350m"

[[playbooks]]
id = "gbnf"
path = "playbook_gbnf.ipynb"
arsenal = "local-models"
enabled = false

[playbooks.params]
model_name = "ling30_tiny"

[[playbooks]]
id = "guidance"
path = "playbook_guidance.ipynb"
arsenal = "local-models"
enabled = false

[playbooks.params]
model_name = "qwen35_4b"

