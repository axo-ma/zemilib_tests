[system]
version = "0.6"

[system.params]

[component]
stop_on_error = true

[component.params]

[[arsenals]]
id = "local-models"
config_path = "@comp/zemi/llm_curated_set_model_mode.toml"
lifecycle = "job"

[arsenals.params]

[[modules]]
id = "default"
kind = "playbook"
path = "@comp/playbook.ipynb"
arsenal = "local-models"
enabled = true

[modules.params]
model_name = "lfm2_350m"

[[modules]]
id = "gbnf"
kind = "playbook"
path = "@comp/playbook_gbnf.ipynb"
arsenal = "local-models"
enabled = false

[modules.params]
model_name = "ling30_tiny"

[[modules]]
id = "guidance"
kind = "playbook"
path = "@comp/playbook_guidance.ipynb"
arsenal = "local-models"
enabled = false

[modules.params]
model_name = "qwen35_4b"

# Explicit parameter reuse:
