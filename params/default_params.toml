[pipeline_params]

[component_params]
stop_on_error = true

[[arsenals]]
name = "local-models"
arsenal_config_path = "@comp/zemi/llm_curated_set_model_mode.toml"
arsenal_start_and_stop_at_job_level = true

[[arsenals.playbooks_params]]
playbook_name = "playbook.ipynb"
enabled = true

    [arsenals.playbooks_params.playbook_params]
    model_name = "lfm2_350m"

[[arsenals.playbooks_params]]
playbook_name = "playbook_gbnf.ipynb"
enabled = false

    [arsenals.playbooks_params.playbook_params]
    model_name = "ling30_tiny"

[[arsenals.playbooks_params]]
playbook_name = "playbook_guidance.ipynb"
enabled = false

    [arsenals.playbooks_params.playbook_params]
    model_name = "qwen35_4b"

